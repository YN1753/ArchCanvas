name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-frontend:
    name: Test Frontend (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd web
          npm test

      - name: Build Web
        run: |
          cd web
          npm run build

  test-backend:
    name: Test Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.27.3'
          cache-dependency-path: 'server/go.sum'

      - name: Run Go Vet & Static Analysis
        run: |
          cd server
          go vet ./...

      - name: Run Go Tests with Race Detector
        run: |
          cd server
          go test -v -race ./...

      - name: Run AI Quality & Architecture Benchmark Gate (35 Scenarios)
        run: |
          cd server
          go test -v ./internal/eval -run TestRunBenchmarkSuite

      - name: Verify Server Build
        run: |
          cd server
          go build -o /dev/null ./cmd/server
